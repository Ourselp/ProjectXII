<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>projectZero</title>
<style>
:root{--panel:#151a1fe6;--line:#3b4652;--accent:#e8b04a;--text:#eef2f5}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font:13px system-ui,sans-serif;color:var(--text)}
canvas{display:block;width:100vw;height:100vh}
button,input,select{font:inherit;color:var(--text);background:#222a33;border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px #0008}
/* top */
#top{position:fixed;left:8px;top:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#info{padding:5px 10px;pointer-events:none}
#info b{color:var(--accent)}
#spacer{flex:1}
#go input{width:120px}
#look{padding:4px 8px;max-width:270px}
#look summary{cursor:pointer}
#look .f{display:grid;gap:4px;margin-top:6px}
#look label{display:flex;justify-content:space-between;gap:6px;align-items:center}
#look input[type=color]{width:24px;height:20px;padding:0;border:0}
/* name above the hero */
#heroname{position:fixed;left:0;top:0;pointer-events:none;font-weight:600;color:#fff;text-shadow:0 0 3px #000,0 0 6px #000;white-space:nowrap}
/* bottom bar */
#bar{position:fixed;right:8px;bottom:8px;display:flex;gap:10px;align-items:stretch;padding:8px 10px}
#plate{display:flex;gap:8px;align-items:center}
#portrait{width:54px;height:54px;border-radius:50%;object-fit:cover;background:#0006;border:2px solid var(--accent)}
#hud-name{font-weight:700;font-size:15px}
#hud-class{opacity:.75;font-size:12px;white-space:nowrap}
#stats{display:flex;gap:6px;align-items:center}
.stat{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;font-weight:700;font-size:12px;text-align:center;line-height:1.05}
.stat small{display:block;font-weight:400;opacity:.8;font-size:10px}
#life{background:radial-gradient(circle at 50% 35%,#e0505a,#7a1620);border:2px solid #f08a90}
#ap{background:radial-gradient(circle at 50% 35%,#4fa3e8,#16467a);border:2px solid #8cc6f2;width:40px;height:40px}
#mp{background:radial-gradient(circle at 50% 35%,#5bc46b,#1d6b2a);border:2px solid #96e0a0;width:40px;height:40px}
#spells{display:grid;grid-template-columns:repeat(12,40px);grid-auto-rows:40px;gap:4px;max-width:calc(12*44px)}
#spells button{position:relative;padding:0;width:40px;height:40px;overflow:hidden;cursor:pointer;background:#0d1115}
#spells button:hover{border-color:var(--accent)}
#spells img{width:100%;height:100%;display:block}
#spells kbd{position:absolute;left:2px;bottom:1px;font-size:9px;color:#fff;text-shadow:0 0 2px #000}
#spells button.cast{animation:cast .5s}
@keyframes cast{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 10px #0000}}
#xp{position:absolute;left:10px;right:10px;top:-4px;height:4px;border-radius:2px;background:#000a;overflow:hidden}
#xp i{display:block;width:12%;height:100%;background:var(--accent)}
#tip{position:fixed;width:260px;padding:8px 10px;pointer-events:none;z-index:5}
#tip b{color:var(--accent);display:block}#tip span{opacity:.8;font-size:12px}#tip p{margin:6px 0 0}
/* chat */
#chat{position:fixed;left:8px;bottom:8px;width:330px;height:150px;display:flex;flex-direction:column;padding:6px}
#chatlog{flex:1;overflow-y:auto;font-size:12px;line-height:1.35}
#chatlog .info{color:#9fd3ff}#chatlog .map{color:#ffd27a}#chatlog .warn{color:#ff9f9f}
#chat form{display:flex;margin-top:4px}#chat input{flex:1}
/* world map */
#wm{position:fixed;inset:50px 40px 40px;z-index:10;display:flex;flex-direction:column;padding:8px}
#wm[hidden]{display:none}
#wm header{display:flex;gap:10px;align-items:center;margin-bottom:6px}#wm header span{flex:1;opacity:.6;font-size:12px}
#wm canvas{flex:1;width:100%;min-height:0;border-radius:6px;cursor:crosshair;touch-action:none}
#wm .tip{position:absolute;padding:5px 8px;pointer-events:none;font-size:12px}#wm .tip b{color:var(--accent)}
@media (max-width:1250px){#chat{display:none}}
</style>
</head><body><canvas id="c"></canvas>
<div id="heroname"></div>
<div id="top">
  <div id="info" class="panel">Chargement…</div><div id="spacer"></div>
  <form id="go"><input name="q" placeholder="x,y ou id de carte" title="Téléportation : coordonnées (ex. 5,-18) ou identifiant de carte"></form>
  <button id="openmap" title="Carte du monde (M)">Carte</button>
  <button id="mute" title="Son"></button>
  <details id="look" class="panel"><summary>Personnage</summary><div class="f"></div></details>
</div>
<div id="chat" class="panel"><div id="chatlog"></div><form id="say"><input name="t" placeholder="Message…" autocomplete="off"></form></div>
<div id="bar" class="panel">
  <div id="xp"><i></i></div>
  <div id="plate"><img id="portrait" alt=""><div><div id="hud-name"></div><div id="hud-class"></div></div></div>
  <div id="stats"><div class="stat" id="life">55<small>/55</small></div><div class="stat" id="ap">6<small>PA</small></div><div class="stat" id="mp">3<small>PM</small></div></div>
  <div id="spells"></div>
</div>
<div id="tip" class="panel" hidden></div>
<div id="wm" class="panel" hidden><header><b>Carte du monde</b><select></select><span>glisser pour déplacer · molette pour zoomer · clic pour s'y rendre</span><button class="close" title="Fermer (Échap)">✕</button></header><canvas></canvas><div class="tip panel" hidden></div></div>
<script type="module" src="game.js"></script></body></html>
