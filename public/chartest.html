<!DOCTYPE html><html><body style="margin:0;background:#7a9">
<canvas id="c" width="900" height="500"></canvas>
<script type="module">
import { loadChar, drawChar } from './char.js';
const gl = document.getElementById('c').getContext('webgl', { premultipliedAlpha: true });
const ch = await loadChar(gl, 'char/iop.json');
const names = ['AnimMarche_0','AnimMarche_1','AnimMarche_2','AnimMarche_5','AnimMarche_6'];
let f = 0;
(function loop(){ gl.clearColor(.48,.6,.53,1); gl.clear(gl.COLOR_BUFFER_BIT);
  const q=new URLSearchParams(location.search);if(q.get('a')){drawChar(gl,ch,q.get('a'),+q.get('f')||0,450,450,2,false);document.title='one';return}names.forEach((n,i)=>drawChar(gl, ch, n, f, 90+i*170, 350, 0.55, false)); f++; document.title='ok '+f; setTimeout(loop, 1000/25); })();
</script></body></html>
